name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: ${{ matrix.pkg.name }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'    # Latest stable
          - 'lts'  # Long Term Support
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
        arch:
          - x64
        pkg:
          - name: SSMProblems
            dir: './SSMProblems'
            local_dep: ''
          - name: GeneralisedFilters
            dir: './GeneralisedFilters'
            local_dep: './SSMProblems'
        exclude:
          - version: 'lts'
            pkg:
              name: GeneralisedFilters
              dir: './GeneralisedFilters'
              local_dep: './SSMProblems'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache artifacts
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=${{ matrix.pkg.dir }}/ --color=yes -e '
          using Pkg;
          Pkg.Registry.update();
          path = "${{ matrix.pkg.local_dep }}";
          isempty(path) || Pkg.develop(PackageSpec(; path));
          Pkg.instantiate();'

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.pkg.dir }}
          coverage: ${{ matrix.os == 'ubuntu-latest' && ((matrix.pkg.name == 'GeneralisedFilters' && matrix.version == '1') || (matrix.pkg.name == 'SSMProblems' && matrix.version == 'lts')) }}

      - name: Process code coverage
        uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && ((matrix.pkg.name == 'GeneralisedFilters' && matrix.version == '1') || (matrix.pkg.name == 'SSMProblems' && matrix.version == 'lts'))
        with:
          directories: ${{ matrix.pkg.dir }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && ((matrix.pkg.name == 'GeneralisedFilters' && matrix.version == '1') || (matrix.pkg.name == 'SSMProblems' && matrix.version == 'lts'))
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.pkg.name }}
          fail_ci_if_error: true

  test-gpu:
    name: GeneralisedFilters - CUDA Extension Load Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64

      - name: Cache artifacts
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=GeneralisedFilters --color=yes -e '
            using Pkg;
            Pkg.Registry.update();
            Pkg.develop(PackageSpec(path="SSMProblems"));
            Pkg.instantiate();'

      - name: Check CUDA extension loading
        run: |
          julia --project=GeneralisedFilters --color=yes -e '
            using Pkg;
            # Load the optional extension without requiring a GPU
            Pkg.add("CUDA");
            using CUDA;
            using GeneralisedFilters;
            println("GeneralisedFilters with CUDA loaded successfully");
            println("CUDA functional: ", CUDA.functional())'