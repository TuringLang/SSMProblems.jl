steps:
  - label: ":julia: Test SSMProblems on Julia v{{matrix.version}}"
    matrix:
      setup:
        version:
          - "1"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    commands:
      - cd SSMProblems
      - |
        julia --project -e '
          import Pkg
          println("+++ :julia: Running SSMProblems tests")
          Pkg.instantiate()
          Pkg.test(coverage=false)'
    agents:
      queue: "cuda"
    timeout_in_minutes: 60
    # Don't run Buildkite if the commit message includes the text [skip tests]
    if: build.message !~ /\[skip tests\]/

  - label: ":julia: :nvidia: Test GeneralisedFilters on Julia v{{matrix.version}}"
    matrix:
      setup:
        version:
          - "1"
    env:
      JULIA_CUDA_USE_BINARYBUILDER: "false"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    commands:
      - cd GeneralisedFilters
      - |
        julia --project -e '
          import Pkg
          Pkg.activate(; temp=true)
          Pkg.develop([Pkg.PackageSpec(path="../SSMProblems"), Pkg.PackageSpec(path=".")])
          Pkg.add(["CUDA", "TestItemRunner", "TestItems", "StableRNGs"])
          using CUDA, TestItemRunner
          CUDA.functional() || error("CUDA hardware is required for this job")
          println("+++ :julia: Running GPU runtime tests")
          TestItemRunner.run_tests(pwd(); filter=ti -> :gpu in ti.tags)'
    agents:
      queue: "cuda"
    timeout_in_minutes: 120
    # Don't run Buildkite if the commit message includes the text [skip tests]
    if: build.message !~ /\[skip tests\]/
